name: Release Android SDK

# Tag this repo to publish. Flutter / iOS / other SDKs are not involved.
#   git tag 2.1.1 && git push origin 2.1.1
# JitPack artifact: com.github.Tareq-Ghassan:GazePointSDK-Android:<tag>

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    name: Assemble library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble release AAR
        run: ./gradlew :gazepoint-sdk:assembleRelease --stacktrace

      - name: Trigger JitPack
        run: |
          TAG="${GITHUB_REF_NAME}"
          curl -fsSL \
            "https://jitpack.io/api/builds/com.github.Tareq-Ghassan/GazePointSDK-Android/${TAG}" \
            || echo "::warning::JitPack trigger failed; open https://jitpack.io/#Tareq-Ghassan/GazePointSDK-Android"
